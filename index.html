<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kamu Kena Prank! 💀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: clamp(30px, 7vw, 52px);
            margin-bottom: 25px;
            color: #ff3b3b;
            font-weight: 900;
        }

        .prank-gif {
            display: block;
            width: 100%;
            max-width: 450px;
            height: auto;
            margin: 0 auto 25px;
            border-radius: 12px;
        }

        .message {
            font-size: clamp(18px, 4vw, 25px);
            line-height: 1.7;
            color: #ffffff;
        }

        .emoji {
            font-size: 35px;
            margin-top: 15px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888888;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>KAMU KENA PRANK! 💀</h1>

        <img
            src="./prank%20gif.gif"
            alt="Prank GIF"
            class="prank-gif"
        >

        <p class="message">
            Maap ya guys 😭🙏<br>
            Ini buat tugas hehehe 🤣
        </p>
        
        <p class="footer">
            Cybersecurity Awareness Assignment
        </p>

    </main>

</body>
</html>
