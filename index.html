<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamu Kena Prank! 😂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffde59, #ff914d);
            color: #222;
        }

        .card {
            max-width: 500px;
            width: 100%;
            padding: 40px 25px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: muncul 0.7s ease;
        }

        .emoji {
            font-size: 90px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
            color: #ff4b2b;
        }

        .subtitle {
            font-size: 19px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .meme {
            background: #fff0c2;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
        }

        .footer {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="emoji">🤡💀</div>

        <h1>KAMU KENA PRANK!</h1>

        <p class="subtitle">
            WKWKWKWK 😭😭😭<br>
            Kirain beneran gratis, ya?!
        </p>

        <div class="meme">
            BRO REALLY SCANNED THE QR CODE 💀<br><br>
            🤡🤡🤡
        </div>

        <p class="footer">
            HAHAHAHA tenang, ini cuma prank kok! 😂<br><br>
            <strong>Website ini dibuat untuk tugas kuliah hehehhe 🤭</strong><br><br>
            Jangan lupa, selalu periksa tautan sebelum membuka
            QR code atau link yang mencurigakan! 🔐
        </p>

    </div>
</body>
</html>
